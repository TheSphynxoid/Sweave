[project]
name = "sweave"
version = "0.1.0"
description = "Multi-agent orchestration platform with persistent specialist agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Sweave Contributors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer[all]>=0.12",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "websockets>=13",
    "watchdog>=4.0",
    "httpx>=0.27",
    "rich>=13.7",
    "hindsight-all-slim>=0.4",
    # M1.6: official MCP SDK (MIT, Anthropic). Small, no agent-loop ownership;
    # §8 policy. Used by sweave/mcp/ (the stdio MCP server the orchestrator
    # spawns via per-project opencode.json) to expose `defer` +
    # `list_specialists` to the orchestrator's opencode serve session.
    "mcp>=2.1,<3",
    # M1.6: tiktoken (MIT, OpenAI) for chain-budget token estimation.
    # Coordination-only (orchestrator turns + defer payloads + result
    # summaries) -- specialist internal work is opaque by design
    # (see plan §Rulings).
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
sweave = "sweave.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501", "UP007"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]