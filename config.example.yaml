# Sweave Configuration — template (tracked).
# Copy to config.yaml and customize. config.yaml itself is a live
# working artifact (user defaults land there at runtime) and is NOT
# tracked — never commit it, never pipe file content into it via
# PowerShell redirection (UTF-16 LE + BOM breaks PyYAML).

server:
  host: "127.0.0.1"
  port: 8080

harness:
  default: "opencode"
  opencode:
    command: "opencode"
    serve_args: ["--port", "0"]
    env: {}

memory:
  backend: "hindsight"
  hindsight:
    mode: "embedded_slim"  # embedded_slim | docker_full | docker_slim | cloud
    api_key:  # Set via HINDSIGHT_API_KEY env var
    api_url:  # Set via HINDSIGHT_API_URL env var
    embeddings_provider: "openai"  # openai | cohere | tei | local
    embeddings_api_key:  # Set via OPENAI_API_KEY env var
    embeddings_model: "text-embedding-3-small"
    reranker_provider: "openai"
    reranker_api_key:
    bank_id: "project-memory"

git:
  provider: "github"
  token:  # Set via GITHUB_TOKEN env var
  worktree_base: ".worktrees"
  auto_pr: true
  pr_base_branch: "main"

models:
  # User default (models.default) is written here at runtime via
  # Settings / set_default_model — not in this template.
  registry_path: "models.yaml"
  rules_path: "rules.yaml"
  hot_reload: true
  roles: {}  # Populated from models.yaml

routing:
  routes: []  # Populated from rules.yaml
  fallback: "llm"
  # NOTE: the global routing scalars (chain_budget, max_depth,
  # turn_timeout_s, turn_retries) are read from rules.yaml, not from
  # this block — load() builds the live routing config from the rules
  # file (config.yaml's routing block is superseded). Set them in
  # rules.yaml alongside routes, or per-project below.
  # M1.6: deferral chain constraints (the orchestrator->specialist->defer
  # path). chain_budget is coordination-token-only (orchestrator turns +
  # defer payloads + result summaries; specialist internal work is opaque).
  chain_budget: 200000
  max_depth: 2
  # Provider-call retries per engine turn: retries AFTER the first
  # attempt (3 = up to 4 tries). Transient failures only (429 / 5xx /
  # rate-limit / network-down / timeouts); auth, bad-request,
  # quota-exhausted and context-overflow never retry. 0 disables.
  turn_retries: 3

# Per-project overlay (two-file ruling): a project may carry
# {project}/.sweave/config.yaml with any subset of the `models` /
# `routing` / `harness` sections. Present fields win per field for
# that project; everything else inherits this global file.
# `server` / `memory` / `git` are process-global and never overridable.
# Example project overlay:
#   models:
#     default: ollama/qwen3:8b
#   routing:
#     turn_timeout_s: 600
#     turn_retries: 5
#   harness:
#     default: opencode
